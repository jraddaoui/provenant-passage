apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenant-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: provenant-ui}
  template:
    metadata:
      labels: {app: provenant-ui}
    spec:
      serviceAccountName: provenant
      containers:
        - name: provenant-ui
          image: provenant-ui:dev
          env:
            - name: PROVENANT_API_ADDRESS
              value: provenant-server.provenant:9000
            - name: VITE_API_PATH
              value: /api
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: provenant-ui
spec:
  selector: {app: provenant-ui}
  ports:
    - {name: http, port: 80}
