apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenant-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: provenant-server
  template:
    metadata:
      labels:
        app: provenant-server
    spec:
      serviceAccountName: provenant
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: provenant-server
          image: provenant-server:dev
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-secret
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-secret
                  key: secret_access_key
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 9000
            - name: health
              containerPort: 9001
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 3
            failureThreshold: 70
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/provenant
              readOnly: true
            - name: scratch
              mountPath: /tmp/provenant-passage
      volumes:
        - name: config
          secret:
            secretName: provenant-config
        - name: scratch
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: provenant-server
spec:
  selector:
    app: provenant-server
  ports:
    - name: http
      port: 9000
