apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: provenant
resources:
- ../../base
- storage.yaml
- network.yaml
configMapGenerator:
- name: provenant-config
  files:
  - provenant.toml
patches:
- path: patch-mysql.yaml
- path: patch-redis.yaml
- path: patch-seaweedfs.yaml
- path: patch-temporal-frontend.yaml
- path: patch-temporal-history.yaml
- path: patch-temporal-matching.yaml
- path: patch-temporal-worker.yaml
- path: patch-temporal-web.yaml
- path: patch-provenant-server.yaml
- path: patch-provenant-ui.yaml
- path: patch-temporal-admintools.yaml
- path: patch-mysql-persistentvolumeclaim.yaml
- path: patch-redis-persistentvolumeclaim.yaml
- path: patch-seaweedfs-pvc.yaml
images:
- name: provenant-server
  newName: ghcr.io/jraddaoui/provenant-passage-server
  newTag: SET_PUBLISHED_DIGEST
- name: provenant-ui
  newName: ghcr.io/jraddaoui/provenant-passage-ui
  newTag: SET_PUBLISHED_DIGEST
