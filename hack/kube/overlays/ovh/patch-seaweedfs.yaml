apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: seaweedfs
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
