apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-web
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: temporal-web
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
