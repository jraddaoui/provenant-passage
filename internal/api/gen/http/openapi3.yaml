openapi: 3.0.3
info:
    title: Provenant Passage API
    version: 0.0.1
servers:
    - url: http://localhost:9000
paths:
    /aips:
        get:
            tags:
                - aips
            summary: list aips
            operationId: aips#list
            parameters:
                - name: limit
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: integer
                    example: 1
                    format: int64
                  example: 1
                - name: offset
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: integer
                    example: 1
                    format: int64
                  example: 1
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResponseBody'
                            example:
                                items:
                                    - created_at: "1970-01-01T00:00:01Z"
                                      name: abc123
                                      ocfl_object_key: abc123
                                      profile: files_metadata_and_manifests
                                      status: processing
                                      uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                                page:
                                    limit: 1
                                    offset: 1
                                    total: 1
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /aips/{uuid}:
        get:
            tags:
                - aips
            summary: show aips
            operationId: aips#show
            parameters:
                - name: uuid
                  in: path
                  description: Import request UUID
                  required: true
                  schema:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
                  example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProvenantAip'
                            example:
                                created_at: "1970-01-01T00:00:01Z"
                                name: abc123
                                ocfl_object_key: abc123
                                profile: files_metadata_and_manifests
                                status: processing
                                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /aips/{uuid}/download:
        get:
            tags:
                - aips
            summary: download aips
            operationId: aips#download
            parameters:
                - name: uuid
                  in: path
                  description: Import request UUID
                  required: true
                  schema:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
                  example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Disposition:
                            schema:
                                type: string
                                example: abc123
                            example: abc123
                        Content-Length:
                            schema:
                                type: integer
                                example: 1
                                format: int64
                            example: 1
                        Content-Type:
                            schema:
                                type: string
                                example: abc123
                            example: abc123
                    content:
                        application/json:
                            schema:
                                type: string
                                format: binary
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /aips/{uuid}/reports/{format}:
        get:
            tags:
                - aips
            summary: report aips
            description: Stream an import report from the output bucket for a completed AIP.
            operationId: aips#report
            parameters:
                - name: uuid
                  in: path
                  description: Import request UUID
                  required: true
                  schema:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
                  example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                - name: format
                  in: path
                  required: true
                  schema:
                    type: string
                    example: md
                    enum:
                        - json
                        - md
                  example: md
            responses:
                "200":
                    description: OK response.
                    headers:
                        Content-Length:
                            schema:
                                type: integer
                                example: 1
                                format: int64
                            example: 1
                        Content-Type:
                            schema:
                                type: string
                                example: abc123
                            example: abc123
                    content:
                        application/json:
                            schema:
                                type: string
                                format: binary
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /aips/monitor:
        get:
            tags:
                - aips
            summary: monitor aips
            operationId: aips#monitor
            responses:
                "200":
                    description: OK response.
                    content:
                        text/event-stream:
                            schema:
                                $ref: '#/components/schemas/AIPEvent'
                            example:
                                value:
                                    type: aip_created_event
                                    value:
                                        item:
                                            created_at: "1970-01-01T00:00:01Z"
                                            name: abc123
                                            ocfl_object_key: abc123
                                            profile: files_metadata_and_manifests
                                            status: processing
                                            uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                                        uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /aips/upload:
        post:
            tags:
                - aips
            summary: upload aips
            operationId: aips#upload
            parameters:
                - name: profile
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                    default: files_and_metadata
                    example: files_metadata_and_manifests
                    enum:
                        - files_and_metadata
                        - files_metadata_and_manifests
                        - original_and_extracted
                  example: files_metadata_and_manifests
                - name: Content-Type
                  in: header
                  required: true
                  schema:
                    type: string
                    example: abc123
                  example: abc123
            responses:
                "202":
                    description: Accepted response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadResponseBody'
                            example:
                                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                "400":
                    description: 'not_valid: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'not_ready: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'unavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        AIPCreatedEvent:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ProvenantAip'
                uuid:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
            example:
                item:
                    created_at: "1970-01-01T00:00:01Z"
                    name: abc123
                    ocfl_object_key: abc123
                    profile: files_metadata_and_manifests
                    status: processing
                    uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            required:
                - uuid
                - item
        AIPEvent:
            type: object
            properties:
                value:
                    type: object
                    example:
                        type: aip_created_event
                        value:
                            item:
                                created_at: "1970-01-01T00:00:01Z"
                                name: abc123
                                ocfl_object_key: abc123
                                profile: files_metadata_and_manifests
                                status: processing
                                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                            uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    anyOf:
                        - type: object
                          properties:
                            type:
                                type: string
                                enum:
                                    - ping_event
                            value:
                                $ref: '#/components/schemas/PingEvent'
                          required:
                            - type
                            - value
                        - type: object
                          properties:
                            type:
                                type: string
                                enum:
                                    - aip_created_event
                            value:
                                $ref: '#/components/schemas/AIPCreatedEvent'
                          required:
                            - type
                            - value
                        - type: object
                          properties:
                            type:
                                type: string
                                enum:
                                    - aip_updated_event
                            value:
                                $ref: '#/components/schemas/AIPUpdatedEvent'
                          required:
                            - type
                            - value
            example:
                value:
                    type: aip_created_event
                    value:
                        item:
                            created_at: "1970-01-01T00:00:01Z"
                            name: abc123
                            ocfl_object_key: abc123
                            profile: files_metadata_and_manifests
                            status: processing
                            uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                        uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
        AIPUpdatedEvent:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ProvenantAip'
                uuid:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
            example:
                item:
                    created_at: "1970-01-01T00:00:01Z"
                    name: abc123
                    ocfl_object_key: abc123
                    profile: files_metadata_and_manifests
                    status: processing
                    uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            required:
                - uuid
                - item
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            description: Error response result type
            example:
                fault: false
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        ListResponseBody:
            type: object
            properties:
                items:
                    $ref: '#/components/schemas/ProvenantAipCollection'
                page:
                    $ref: '#/components/schemas/ProvenantPage'
            example:
                items:
                    - created_at: "1970-01-01T00:00:01Z"
                      name: abc123
                      ocfl_object_key: abc123
                      profile: files_metadata_and_manifests
                      status: processing
                      uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                page:
                    limit: 1
                    offset: 1
                    total: 1
            required:
                - items
                - page
        PingEvent:
            type: object
            properties:
                message:
                    type: string
                    example: abc123
            example:
                message: abc123
        ProvenantAip:
            type: object
            properties:
                created_at:
                    type: string
                    example: "1970-01-01T00:00:01Z"
                    format: date-time
                name:
                    type: string
                    example: abc123
                ocfl_object_key:
                    type: string
                    example: abc123
                profile:
                    type: string
                    example: files_metadata_and_manifests
                    enum:
                        - files_and_metadata
                        - files_metadata_and_manifests
                        - original_and_extracted
                status:
                    type: string
                    example: processing
                    enum:
                        - queued
                        - processing
                        - completed
                        - error
                        - canceled
                uuid:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
            example:
                created_at: "1970-01-01T00:00:01Z"
                name: abc123
                ocfl_object_key: abc123
                profile: files_metadata_and_manifests
                status: processing
                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            required:
                - uuid
                - name
                - status
                - created_at
                - profile
        ProvenantAipCollection:
            type: array
            items:
                $ref: '#/components/schemas/ProvenantAip'
            example:
                - created_at: "1970-01-01T00:00:01Z"
                  name: abc123
                  ocfl_object_key: abc123
                  profile: files_metadata_and_manifests
                  status: processing
                  uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
        ProvenantPage:
            type: object
            properties:
                limit:
                    type: integer
                    example: 1
                    format: int64
                offset:
                    type: integer
                    example: 1
                    format: int64
                total:
                    type: integer
                    example: 1
                    format: int64
            example:
                limit: 1
                offset: 1
                total: 1
            required:
                - limit
                - offset
                - total
        UploadResponseBody:
            type: object
            properties:
                uuid:
                    type: string
                    description: Import request UUID
                    example: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
                    format: uuid
            example:
                uuid: d1845cb6-a5ea-474a-9ab8-26f9bcd919f5
            required:
                - uuid
tags:
    - name: aips
